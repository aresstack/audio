plugins {
    id 'java-library'
}

// The full screen of the visualizer on the graphics card: Direct3D 11 on Windows (WARP where no
// driver is), OpenGL 3.3 on Linux. The engine core under com.aresstack.threed4j is taken over
// unchanged from 3d4j (see UPSTREAM.md); it reaches the system libraries through the FFM API, which
// is a preview API in Java 21. So this module, and only this one, is compiled with
// --enable-preview. The API under com.aresstack.audio.gpu uses no preview feature itself: the studio
// compiles against it as usual and the screen simply reports itself unavailable on a JVM started
// without --enable-preview (or on another Java than 21), where the studio stays with Java2D.
dependencies {
    testImplementation 'junit:junit:4.13.2'
}

tasks.named('compileJava') {
    options.compilerArgs += ['--enable-preview', '-Xlint:-preview']
}

tasks.named('compileTestJava') {
    options.compilerArgs += ['--enable-preview', '-Xlint:-preview']
}

tasks.named('test') {
    jvmArgs '--enable-preview', '--enable-native-access=ALL-UNNAMED', '-Djava.awt.headless=true'
}

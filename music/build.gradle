plugins {
    id 'application'
}

application {
    mainClass = 'MultiTrackMusicRenderer'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

tasks.named('jar') {
    archiveFileName = 'music-renderer.jar'
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}

tasks.register('renderDemo', JavaExec) {
    group = 'verification'
    description = 'Render the checked-in original demonstration arrangement.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    args file('examples/demo-arrangement.tsv').absolutePath,
            layout.buildDirectory.dir('demo-output').get().asFile.absolutePath
}

tasks.named('check') {
    dependsOn tasks.named('renderDemo')
}

tasks.register('soundFontJar', Jar) {
    group = 'build'
    description = 'Build the standalone FluidSynth-backed SoundFont CLI.'
    archiveFileName = 'music-soundfont-renderer.jar'
    from sourceSets.main.output
    dependsOn tasks.named('classes')
    manifest {
        attributes 'Main-Class': 'com.aresstack.audio.music.soundfont.SoundFontMidiRenderer'
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('soundFontJar')
}

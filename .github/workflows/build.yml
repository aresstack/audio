name: Build audio modules
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compile Java 8 compatible modules and render music demo
        run: gradle clean build --no-daemon
      - name: Archive demo music (WAV and MIDI)
        uses: actions/upload-artifact@v4
        with:
          name: music-demo
          path: music/build/demo-output/

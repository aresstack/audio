name: Build and publish audio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 for Gradle (Java sources target 8)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build, test and render examples
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew clean build --no-daemon --stacktrace

      - name: Verify PowerShell syntax and harmonic repair cases
        shell: pwsh
        run: |
          $scripts = @(
            'music/experiments/kipitz-gemma-multitrack.ps1',
            'music/experiments/test-harmonic-pitch.ps1',
            'sounds/experiments/kipitz-gemma-sounds.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              throw "PowerShell syntax error in $script : $($parseErrors[0])"
            }
          }
          & ./music/experiments/test-harmonic-pitch.ps1
          & ./music/experiments/test-cached-render.ps1

      - name: Smoke-test the standalone renderer JARs
        shell: bash
        run: |
          set -euo pipefail
          java -jar music/build/libs/music-renderer.jar music/examples/demo-arrangement.tsv build/smoke-music
          java -jar sounds/build/libs/sounds-renderer.jar sounds/examples/sound-plan.json build/smoke-sounds
          test -s build/smoke-music/arrangement.mid
          test -s build/smoke-music/arrangement.wav
          test -s build/smoke-sounds/new-sea-creature.wav
          test -s build/smoke-sounds/new-district.wav

      - name: Verify runnable Swing Studio JAR headlessly
        shell: bash
        run: |
          set -euo pipefail
          java -jar studio/build/libs/audio-studio.jar --smoke-test
          javap -verbose -cp studio/build/libs/audio-studio.jar com.aresstack.audio.studio.ui.AudioStudioMain | grep -q 'major version: 52'
          unzip -p studio/build/libs/audio-studio.jar META-INF/MANIFEST.MF | grep -q 'Main-Class: com.aresstack.audio.studio.ui.AudioStudioMain'

      - name: Verify real Java 8 runtime compatibility
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Run Java 8 studio and SoundFont CLI smoke tests
        shell: bash
        run: |
          set -euo pipefail
          java -version
          java -jar studio/build/libs/audio-studio.jar --smoke-test
          java -jar music/build/libs/music-renderer.jar music/examples/demo-arrangement.tsv build/java8-test-music
          test -s build/java8-test-music/arrangement.wav

      - name: Render the original Gemma MIDI with GeneralUser GS
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fluidsynth ffmpeg
          mkdir -p build/soundfont-compare build/soundfonts

          # Pin soundbank bytes to prevent changes in the upstream branch from changing the output.
          curl --fail --location --silent --show-error --retry 3             https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/main/GeneralUser-GS.sf2             --output build/soundfonts/GeneralUser-GS.sf2
          echo "9575028c7a1f589f5770fccc8cff2734566af40cd26ed836944e9a5152688cfe  build/soundfonts/GeneralUser-GS.sf2" | sha256sum --check

          java -jar music/build/libs/music-renderer.jar             music/examples/gemma-district-dawn.tsv build/soundfont-compare/original
          java -jar music/build/libs/music-soundfont-renderer.jar             build/soundfont-compare/original/arrangement.mid             build/soundfonts/GeneralUser-GS.sf2             build/soundfont-compare/district-dawn-generaluser.wav

          test -s build/soundfont-compare/district-dawn-generaluser.wav
          test -s build/soundfont-compare/original/arrangement.wav
          ffmpeg -hide_banner -loglevel error -y             -i build/soundfont-compare/district-dawn-generaluser.wav             -codec:a libmp3lame -qscale:a 3 build/soundfont-compare/district-dawn-generaluser.mp3
          ffmpeg -hide_banner -loglevel error -y             -i build/soundfont-compare/original/arrangement.wav             -codec:a libmp3lame -qscale:a 3 build/soundfont-compare/district-dawn-synth.mp3
          test -s build/soundfont-compare/district-dawn-generaluser.mp3
          test -s build/soundfont-compare/district-dawn-synth.mp3

      - name: Smoke-test Swing Studio with actual GeneralUser soundbank
        shell: bash
        run: |
          set -euo pipefail
          java -jar studio/build/libs/audio-studio.jar --smoke-test build/soundfonts/GeneralUser-GS.sf2

      - name: Stage verified JARs and the MIDI/SoundFont A/B comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release
          cp music/build/libs/music-renderer.jar build/release/music-renderer.jar
          cp studio/build/libs/audio-studio.jar build/release/audio-studio.jar
          cp music/build/libs/music-soundfont-renderer.jar build/release/music-soundfont-renderer.jar
          cp sounds/build/libs/sounds-renderer.jar build/release/sounds-renderer.jar
          cp build/soundfont-compare/original/arrangement.mid build/release/district-dawn.mid
          cp build/soundfont-compare/original/arrangement.wav build/release/district-dawn-synth.wav
          cp build/soundfont-compare/district-dawn-generaluser.wav build/release/district-dawn-generaluser.wav
          cp build/soundfont-compare/district-dawn-synth.mp3 build/release/district-dawn-synth.mp3
          cp build/soundfont-compare/district-dawn-generaluser.mp3 build/release/district-dawn-generaluser.mp3

      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: audio-jars
          path: build/release/*
          if-no-files-found: error
          retention-days: 30

  windows-constrained-smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download tested Java renderer for Windows PowerShell smoke test
        uses: actions/download-artifact@v4
        with:
          name: audio-jars
          path: music/build/libs

      - name: Test the entire cached generation under Windows PowerShell 5.1 ConstrainedLanguage
        shell: powershell
        run: |
          & .\music\experiments\test-cached-render.ps1

  rolling-release:
    needs: [build, windows-constrained-smoke]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified JAR files
        uses: actions/download-artifact@v4
        with:
          name: audio-jars
          path: release

      - name: Update fixed latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="latest"
          notes="Rolling build from main commit $GITHUB_SHA. Contains Java 8-compatible Swing Audio Studio, music, sound effect, and FluidSynth SoundFont renderer JARs. District Dawn is the exact Gemma composition in two timbres: simple Java synthesis vs. GeneralUser GS 2.0.3/FluidSynth at 44.1 kHz. SoundFont: S. Christian Collins, GeneralUser GS License v2.0; only rendered original music is published."

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Audio – current build" --notes "$notes"
          else
            # Move the rolling tag to the commit the published binaries came from.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit "$tag" --title "Audio – current build" --notes "$notes"
          fi

          gh release upload "$tag" release/audio-studio.jar release/music-renderer.jar release/music-soundfont-renderer.jar release/sounds-renderer.jar \
            release/district-dawn.mid release/district-dawn-synth.wav release/district-dawn-generaluser.wav \
            release/district-dawn-synth.mp3 release/district-dawn-generaluser.mp3 --clobber
